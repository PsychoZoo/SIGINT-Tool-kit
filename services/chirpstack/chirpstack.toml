# ChirpStack v4 configuration, adapted from github.com/chirpstack/chirpstack-docker
# (MIT, see LICENSE.chirpstack-docker). The region_*.toml files are copies with
# the gateway backend's MQTT username/password filled in from the environment.
# $VARIABLES are filled in from the container environment (see integrations.yml).

[logging]
  level="info"

# ChirpStack keeps its own tables in the 'chirpstack' database on the shared
# Postgres server (created by db/init/02_chirpstack.sql).
[postgresql]
  dsn="postgres://$POSTGRESQL_USER:$POSTGRESQL_PASSWORD@$POSTGRESQL_HOST/chirpstack?sslmode=disable"
  max_open_connections=10
  min_idle_connections=0

[redis]
  servers=["redis://$REDIS_HOST/"]
  tls_enabled=false
  cluster=false

[network]
  net_id="000000"

  # Must include the region your gateways use (LORA_REGION in .env).
  enabled_regions=[
    "as923",
    "as923_2",
    "as923_3",
    "as923_4",
    "au915_0",
    "cn470_10",
    "cn779",
    "eu433",
    "eu868",
    "in865",
    "ism2400",
    "kr920",
    "ru864",
    "us915_0",
    "us915_1",
  ]

[api]
  bind="0.0.0.0:8080"
  secret="$CHIRPSTACK_API_SECRET"

# Device events go to the shared broker on
# application/<application_id>/device/<dev_eui>/event/<event>; the chirpstack
# bridge republishes them as sigint/<node>/chirpstack/data/<event> so they are stored.
[integration]
  enabled=["mqtt"]

  [integration.mqtt]
    server="tcp://$MQTT_BROKER_HOST:1883/"
    username="$MQTT_USERNAME"
    password="$MQTT_PASSWORD"
    json=true
